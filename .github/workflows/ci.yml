name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单测 + 编译 Debug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 在部分 runner 镜像里还没预装，显式装一次更稳
      - name: 安装 SDK 组件
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 领域层单测（纯 JVM）
        run: ./gradlew :core:domain:test --stacktrace

      - name: 编译 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            core/domain/build/reports/tests/test
            core/domain/build/test-results/test
          if-no-files-found: ignore

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meowmorize-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

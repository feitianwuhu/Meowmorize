name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单测 + 编译 Debug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 在 runner 镜像里不一定预装。装不上也不致命：
      # setup-android 已接受许可，AGP 会在构建时按需下载缺失的平台组件。
      - name: 安装 SDK 组件
        continue-on-error: true
        run: |
          sdkmanager --install "platforms;android-37" "platform-tools" \
            || sdkmanager --install "platforms;android-37.0" "platform-tools" \
            || true

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # v1.0.0~v1.0.2「点开即闪退」的根因就是这类问题：Java 9+ 追加、Android 低版本
      # 没有实现的方法，编译期完全合法（android.jar 里有），运行期抛 NoSuchMethodError。
      # lint 的 NewApi 只比对 android.jar，抓不到；只能用文本门禁兜住。
      - name: 禁止使用低版本缺失的 Java API
        run: |
          set -euo pipefail
          patterns='LocalDate\.ofInstant|LocalTime\.ofInstant|Duration\.toSecondsPart|Duration\.toMillisPart|Duration\.toNanosPart|\.datesUntil\(|String\.strip\('
          # 注释里提到这些名字是允许的（本项目就专门写过一段说明），只拦真正的调用
          hits=$(grep -rnE "$patterns" --include='*.kt' . \
            | grep -vE ':[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::以上调用需要 Android API 34+，而本包 minSdk 29，会在低版本设备上抛 NoSuchMethodError"
            exit 1
          fi
          echo "未发现低版本缺失的 Java API"

      - name: 领域层单测（纯 JVM）
        run: ./gradlew :core:domain:test --stacktrace

      - name: 编译 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            core/domain/build/reports/tests/test
            core/domain/build/test-results/test
          if-no-files-found: ignore

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meowmorize-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
